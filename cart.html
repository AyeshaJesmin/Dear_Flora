<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <title>Your Cart | Dear Flora</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/cart.js" defer></script>
</head>
<body class="cart-page">
  <header>
    <a href="index.html" class="logo-link"><img src="image/logo.jpeg" alt="Dear Flora Logo" class="logo"></a>
    <nav>
      <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="customize.html">Customize</a>
      <a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html" aria-current="page">Cart</a>
    </nav>
  </header>

  <main class="cart-main">
    <section class="cart-intro">
      <p class="eyebrow">STEP 1 OF 3</p>
      <h1>Your Cart</h1>
      <p>Review your bouquets before checking out.</p>
    </section>

    <div class="cart-layout">
      <section class="cart-items-panel" aria-label="Cart items">
        <div class="cart-list" id="cartList">
          <!-- cart items injected by cart.js -->
        </div>

        <div class="cart-empty" id="cartEmpty" hidden>
          <p>Your cart is empty.</p>
          <a href="shop.html" class="btn">Browse Bouquets</a>
        </div>
      </section>

      <aside class="cart-summary" aria-label="Order summary">
        <p class="eyebrow">ORDER SUMMARY</p>
        <div class="summary-row"><span>Subtotal</span><strong id="subtotalAmount">Rs. 0</strong></div>
        <div class="summary-row"><span>Delivery</span><strong id="deliveryAmount">Rs. 0</strong></div>
        <div class="summary-divider"></div>
        <div class="summary-row summary-total"><span>Total</span><strong id="totalAmount">Rs. 0</strong></div>
        <button type="button" class="btn checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        <p class="summary-note">Prices are estimates. Final total confirmed before delivery.</p>
      </aside>
    </div>
  </main>

  <template id="cartItemTemplate">
    <article class="cart-item">
      <img class="cart-item-image" src="" alt="" width="96" height="96">
      <div class="cart-item-info">
        <h2 class="cart-item-name"></h2>
        <p class="cart-item-variant"></p>
        <p class="cart-item-price"></p>
        <div class="cart-item-actions">
          <div class="quantity-control" aria-label="Quantity selector">
            <button type="button" class="qty-decrease" aria-label="Decrease quantity">−</button>
            <span class="qty-value">1</span>
            <button type="button" class="qty-increase" aria-label="Increase quantity">+</button>
          </div>
          <button type="button" class="remove-item-btn">Remove</button>
        </div>
      </div>
      <p class="cart-item-line-total"></p>
    </article>
  </template>
</body>
</html>
